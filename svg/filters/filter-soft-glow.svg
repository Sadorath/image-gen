<svg xmlns="http://www.w3.org/2000/svg" data-svg-type="filter" data-svg-name="soft-glow">
  <!-- A soft outer glow: blur a copy of the layer's own alpha shape, flood
       it with a bright color, then merge that glow behind the original
       artwork. Pick this preset from a layer's Filters panel (Custom SVG
       Filter section), or copy the filter element below into your own
       pasted markup as a starting point. -->
  <filter id="svgFilterSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
    <feFlood flood-color="#8fe3ff" flood-opacity="0.85" result="glowColor"/>
    <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</svg>
