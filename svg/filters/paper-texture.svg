<svg xmlns="http://www.w3.org/2000/svg" data-svg-type="filter" data-svg-name="paper-texture" style="display: none;">
  <filter id="paper-texture">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
    <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="light">
      <feDistantLight azimuth="60" elevation="50" />
    </feDiffuseLighting>
    <feComponentTransfer result="grain">
      <feFuncR type="linear" slope="0.2" />
      <feFuncG type="linear" slope="0.2" />
      <feFuncB type="linear" slope="0.2" />
    </feComponentTransfer>
    <feBlend mode="multiply" in="SourceGraphic" in2="grain" />
  </filter>
</svg>
