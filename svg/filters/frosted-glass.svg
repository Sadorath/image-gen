<svg xmlns="http://www.w3.org/2000/svg" data-svg-type="filter" data-svg-name="frosted-glass" style="display: none;">
  <filter id="frosted-glass">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
    <feDisplacementMap in="blur" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    <feComponentTransfer in="displaced" result="brightened">
      <feFuncR type="linear" slope="1.1" intercept="0.05" />
      <feFuncG type="linear" slope="1.1" intercept="0.05" />
      <feFuncB type="linear" slope="1.1" intercept="0.05" />
    </feComponentTransfer>
  </filter>
</svg>
