<svg xmlns="http://www.w3.org/2000/svg" data-svg-type="filter" data-svg-name="duotone-matrix" style="display: none;">
  <filter id="duotone-matrix">
    <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" result="gray" />
    <feComponentTransfer color-interpolation-filters="sRGB">
      <feFuncR type="linear" slope="1" intercept="0.1" />
      <feFuncG type="linear" slope="0.8" intercept="0.2" />
      <feFuncB type="linear" slope="0.5" intercept="0.4" />
    </feComponentTransfer>
  </filter>
</svg>
