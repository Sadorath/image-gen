<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- This file is deliberately tiny and should rarely need to change. All of
     the actual app lives in main.html now -- this page just forwards to it.
     Two reasons for splitting it out this way:
     1. Some static-file hosts and CDNs cache "index.html" specifically (as
        the default document for a folder) more aggressively, or on a
        different schedule, than any other file. Since this file basically
        never changes, that caching stops being something to fight -- every
        real update only ever touches main.html.
     2. The redirect below appends a cache-busting query string to the
        main.html request, so even a host/browser that WOULD cache it is
        forced to fetch a fresh copy every time -- no waiting on a cache to
        expire to see the latest version.
     Any #state=... (share link) or ?... (query string) on this page's own
     URL is carried over to main.html unchanged, so bookmarked and shared
     links keep working exactly the same as if they pointed at main.html
     directly. -->
<title>Background Image Generator</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:#14171a; color:#9aa5ac;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  a{ color:#5DC1AD; }
</style>
<script>
(function(){
  "use strict";
  // A fresh cache-busting value per load -- guarantees the browser (or any
  // caching layer in front of it) can't serve back a stale main.html.
  var bust = 'v=' + Date.now().toString(36);
  var search = location.search ? location.search + '&' + bust : '?' + bust;
  var target = 'main.html' + search + location.hash;
  location.replace(target);
})();
</script>
<!-- No-JS / redirect-blocked fallback -->
<meta http-equiv="refresh" content="0; url=main.html" />
</head>
<body>
  <p>Loading&hellip; if you're not redirected automatically, <a href="main.html">open the app here</a>.</p>
</body>
</html>
